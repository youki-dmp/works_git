<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
  </defs>
  <!-- カード背景 -->
  <rect x="20" y="20" width="920" height="500" rx="24" fill="url(#bg)" stroke="#6366f1" stroke-width="4" />
  
  <!-- タイトルバー -->
  <rect x="50" y="50" width="860" height="70" rx="12" fill="#4338ca" />
  <text x="80" y="98" font-family="'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="34" font-weight="bold" fill="#ffffff">
    💡 解説動画の自動化パイプライン
  </text>
  
  <!-- 3ステップのカード -->
  <!-- Step 1 -->
  <rect x="60" y="160" width="250" height="280" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
  <circle cx="110" cy="210" r="28" fill="#38bdf8" />
  <text x="100" y="222" font-family="sans-serif" font-size="28" font-weight="bold" fill="#0f172a">1</text>
  <text x="155" y="218" font-family="sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">台本生成</text>
  <text x="80" y="280" font-family="sans-serif" font-size="18" fill="#94a3b8">・Gemini/Antigravity</text>
  <text x="80" y="320" font-family="sans-serif" font-size="18" fill="#94a3b8">・構成 &amp; セリフ作成</text>
  <text x="80" y="360" font-family="sans-serif" font-size="18" fill="#94a3b8">・JSON/MD構造化</text>

  <!-- Step 2 -->
  <rect x="355" y="160" width="250" height="280" rx="16" fill="#1e293b" stroke="#4ade80" stroke-width="3" />
  <circle cx="405" cy="210" r="28" fill="#4ade80" />
  <text x="395" y="222" font-family="sans-serif" font-size="28" font-weight="bold" fill="#0f172a">2</text>
  <text x="450" y="218" font-family="sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">音声・音素解析</text>
  <text x="375" y="280" font-family="sans-serif" font-size="18" fill="#94a3b8">・VOICEVOX API</text>
  <text x="375" y="320" font-family="sans-serif" font-size="18" fill="#94a3b8">・WAV音声自動合成</text>
  <text x="375" y="360" font-family="sans-serif" font-size="18" fill="#94a3b8">・口パク音素抽出</text>

  <!-- Step 3 -->
  <rect x="650" y="160" width="250" height="280" rx="16" fill="#1e293b" stroke="#f472b6" stroke-width="3" />
  <circle cx="700" cy="210" r="28" fill="#f472b6" />
  <text x="690" y="222" font-family="sans-serif" font-size="28" font-weight="bold" fill="#0f172a">3</text>
  <text x="745" y="218" font-family="sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">Remotion合成</text>
  <text x="670" y="280" font-family="sans-serif" font-size="18" fill="#94a3b8">・立ち絵リップシンク</text>
  <text x="670" y="320" font-family="sans-serif" font-size="18" fill="#94a3b8">・YouTube風テロップ</text>
  <text x="670" y="360" font-family="sans-serif" font-size="18" fill="#94a3b8">・高速MP4出力</text>
</svg>
