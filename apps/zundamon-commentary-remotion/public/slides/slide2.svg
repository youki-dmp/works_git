<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="920" height="500" rx="24" fill="url(#bg2)" stroke="#38bdf8" stroke-width="4" />
  <rect x="50" y="50" width="860" height="70" rx="12" fill="#0284c7" />
  <text x="80" y="98" font-family="'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="34" font-weight="bold" fill="#ffffff">
    ⚡ Remotionによる動画制御のメリット
  </text>
  
  <g transform="translate(60, 160)">
    <!-- Point 1 -->
    <rect x="0" y="0" width="840" height="90" rx="12" fill="#1e293b" stroke="#0ea5e9" stroke-width="2" />
    <text x="30" y="55" font-family="sans-serif" font-size="24" font-weight="bold" fill="#38bdf8">1. コード駆動で完全自動化</text>
    <text x="400" y="55" font-family="sans-serif" font-size="20" fill="#cbd5e1">APIやスクリプトから一発でレンダリング可能</text>

    <!-- Point 2 -->
    <rect x="0" y="110" width="840" height="90" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2" />
    <text x="30" y="165" font-family="sans-serif" font-size="24" font-weight="bold" fill="#4ade80">2. ブラウザ即時プレビュー</text>
    <text x="400" y="165" font-family="sans-serif" font-size="20" fill="#cbd5e1">シークバーで細部までリアルタイム確認・調整</text>

    <!-- Point 3 -->
    <rect x="0" y="220" width="840" height="90" rx="12" fill="#1e293b" stroke="#e879f9" stroke-width="2" />
    <text x="30" y="275" font-family="sans-serif" font-size="24" font-weight="bold" fill="#f472b6">3. Mac/Linuxネイティブ対応</text>
    <text x="400" y="275" font-family="sans-serif" font-size="20" fill="#cbd5e1">Windows専用ツール(YMM4等)に依存しない環境</text>
  </g>
</svg>
