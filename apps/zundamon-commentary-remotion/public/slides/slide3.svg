<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="920" height="500" rx="24" fill="url(#bg3)" stroke="#4ade80" stroke-width="4" />
  <rect x="50" y="50" width="860" height="70" rx="12" fill="#15803d" />
  <text x="80" y="98" font-family="'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="34" font-weight="bold" fill="#ffffff">
    🚀 次のステップ：オリジナルの動画を作ろう！
  </text>
  
  <g transform="translate(100, 180)">
    <text x="0" y="40" font-family="sans-serif" font-size="28" font-weight="bold" fill="#f0fdf4">
      1. 台本 (script.json) にセリフを入力
    </text>
    <text x="0" y="100" font-family="sans-serif" font-size="28" font-weight="bold" fill="#f0fdf4">
      2. npm run generate で音声とタイムライン生成
    </text>
    <text x="0" y="160" font-family="sans-serif" font-size="28" font-weight="bold" fill="#f0fdf4">
      3. npm start でブラウザプレビュー確認
    </text>
    <text x="0" y="220" font-family="sans-serif" font-size="28" font-weight="bold" fill="#facc15">
      4. npm run build で高画質MP4を一発出力！
    </text>
  </g>
</svg>
