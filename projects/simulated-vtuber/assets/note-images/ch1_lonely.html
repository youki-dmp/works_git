<!DOCTYPE html>
<html>
<head>
<style>
body { background: #020617; display: grid; place-items: center; height: 100vh; margin: 0; }
.desk { position: relative; width: 400px; height: 300px; background: #0f172a; border-radius: 10px; box-shadow: 0 0 50px rgba(56, 189, 248, 0.2); overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
.monitor { position: absolute; top: 50px; left: 100px; width: 200px; height: 120px; background: #38bdf8; filter: blur(30px); opacity: 0.4; animation: glow 4s infinite alternate; }
@keyframes glow { from { opacity: 0.2; } to { opacity: 0.6; } }
.cup { position: absolute; bottom: 40px; right: 80px; width: 30px; height: 40px; background: #1e293b; border-radius: 5px; }
.room-text { position: absolute; bottom: 20px; left: 20px; color: #334155; font-size: 12px; font-family: serif; font-style: italic; }
</style>
</head>
<body>
<div class="desk">
  <div class="monitor"></div>
  <div class="cup"></div>
  <div class="room-text">Sunday 18:00... The silence is heavy.</div>
</div>
</body>
</html>
