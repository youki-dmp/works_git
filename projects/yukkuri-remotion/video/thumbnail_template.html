<!DOCTYPE html>
<html>
<head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&display=swap');
    
    body {
        margin: 0;
        padding: 0;
        width: 1920px;
        height: 1080px;
        background: #000;
        color: white;
        font-family: 'Noto Sans JP', sans-serif;
        overflow: hidden;
        position: relative;
    }
    .background-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.5;
        z-index: 1;
    }
    .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.7) 100%);
        z-index: 2;
    }
    .characters {
        position: absolute;
        bottom: -30px;
        width: 100%;
        display: flex;
        justify-content: space-between;
        padding: 0 20px;
        box-sizing: border-box;
        z-index: 10;
    }
    .char {
        height: 950px;
        filter: drop-shadow(0 0 30px rgba(0,0,0,0.9));
    }
    .text-area {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 20;
        text-align: center;
    }
    /* The "Super Outline" Trick: Multiple text-shadows for a thick, clean border */
    .main-title {
        font-size: 200px;
        margin: 0;
        padding: 0 450px;
        color: white;
        line-height: 1;
        letter-spacing: -0.05em;
        text-shadow: 
            8px 8px 0 #ff0000, -8px -8px 0 #ff0000, 8px -8px 0 #ff0000, -8px 8px 0 #ff0000,
            0px 8px 0 #ff0000, 0px -8px 0 #ff0000, 8px 0px 0 #ff0000, -8px 0px 0 #ff0000,
            12px 12px 20px rgba(0,0,0,0.8);
    }
    .sub-title {
        font-size: 80px;
        color: #ffff00;
        background: rgba(0,0,0,0.85);
        padding: 15px 60px;
        border-radius: 20px;
        border: 6px solid white;
        margin-top: 40px;
        box-shadow: 10px 10px 30px rgba(0,0,0,0.5);
    }
    .badge {
        position: absolute;
        top: 50px;
        left: 50px;
        background: #ff0055;
        color: white;
        padding: 20px 50px;
        font-size: 45px;
        font-weight: 900;
        border-radius: 15px;
        box-shadow: 8px 8px 0px #000;
        z-index: 30;
    }
    .reaction-bubble {
        position: absolute;
        top: 80px;
        right: 150px;
        background: white;
        color: #ff0000;
        padding: 30px 60px;
        border-radius: 100px;
        font-size: 65px;
        font-weight: 900;
        border: 10px solid #ffaa00;
        transform: rotate(8deg);
        box-shadow: 15px 15px 0px rgba(0,0,0,0.2);
        z-index: 30;
    }
</style>
</head>
<body>
    <img id="bg" class="background-image" src="">
    <div class="vignette"></div>
    
    <div class="badge">世界の法律</div>

    <div class="text-area">
        <h1 class="main-title" id="title"></h1>
        <div class="sub-title" id="subtitle"></div>
    </div>

    <div class="reaction-bubble" id="reaction"></div>
    
    <div class="characters">
        <img class="char" src="public/ずんだもん立ち絵素材2.3.png" style="transform: scaleX(-1);">
        <img class="char" src="public/四国めたん立ち絵素材2.1.png">
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('title').innerText = params.get('title') || 'タイトル';
        document.getElementById('subtitle').innerText = params.get('subtitle') || '';
        document.getElementById('reaction').innerText = params.get('reaction') || '';
        document.getElementById('bg').src = 'public/background/' + (params.get('bg') || 'city.jpg');
    </script>
</body>
</html>
